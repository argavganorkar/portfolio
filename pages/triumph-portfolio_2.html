<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triumph Bobber — CMFG Design · Argav Ganorkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0B; --ink: #EDECEA; --ink-2: #767370;
    --border: #242220; --accent: #3D7EFF;
    --body: 'DM Sans', system-ui, sans-serif;
    --ease-out: cubic-bezier(0.16,1,0.3,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; scroll-behavior:smooth; }
  body { background:#fff; font-family:'Inter',sans-serif; }
  img { max-width:100%; width:100%; height:auto; display:block; }
  .sec-img { display:block; width:100%; }
  .sec-img img { width:100%; height:auto; display:block; }

  /* FIXED-CANVAS SCALE LOCK (1920x1080 baseline, matches index.html) */
  #scaleOuter { position:relative; overflow:hidden; width:100%; }
  #scaleRoot { position:absolute; top:0; left:0; width:1920px; transform-origin: top left; }

  /* NAV */
  #nav {
    position:fixed; top:0; left:0; width:1920px; transform-origin: top left; z-index:9997;
    padding:22px 115.2px; display:flex; align-items:center;
    justify-content:space-between;
    transition:background 0.5s var(--ease-out), border-color 0.5s;
    border-bottom:1px solid transparent;
  }
  #nav.scrolled {
    background:rgba(11,11,11,0.90);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-bottom-color:var(--border);
  }
  .nav-logo {
    font-family:var(--body); font-size:1.0rem; font-weight:600;
    letter-spacing:0.04em; color:var(--ink); text-decoration:none;
  }
  .nav-links { display:flex; align-items:center; gap:36px; list-style:none; }
  .nav-links a {
    font-family:var(--body); font-size:0.75rem; font-weight:400;
    letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-2); text-decoration:none; transition:color 0.2s;
  }
  .nav-links a:hover { color:#fff; }
  .nav-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.5);
    vertical-align: -4px;
    margin-right: 0;
    transition: width 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.2s, transform 0.25s cubic-bezier(0.16,1,0.3,1), margin-right 0.25s cubic-bezier(0.16,1,0.3,1);
  }
  .nav-icon svg { width: 18px; height: 18px; display: block; }
  .nav-links a:hover .nav-icon,
  .nav-links a:focus-visible .nav-icon {
    width: 18px;
    opacity: 1;
    transform: scale(1);
    margin-right: 7px;
  }
  @keyframes nav-phone-ring {
    0%, 55%, 100% { transform: rotate(0deg); }
    8% { transform: rotate(-18deg); }
    16% { transform: rotate(14deg); }
    24% { transform: rotate(-10deg); }
    32% { transform: rotate(7deg); }
    40% { transform: rotate(-4deg); }
    48% { transform: rotate(2deg); }
  }
  .nav-links a:hover .nav-icon-phone svg,
  .nav-links a:focus-visible .nav-icon-phone svg {
    animation: nav-phone-ring 1.1s ease-in-out infinite;
    transform-origin: 50% 25%;
  }
  @keyframes nav-text-ring {
    0%, 55%, 100% { transform: rotate(0deg); }
    8% { transform: rotate(-9deg); }
    16% { transform: rotate(7deg); }
    24% { transform: rotate(-5deg); }
    32% { transform: rotate(3deg); }
    40% { transform: rotate(-2deg); }
    48% { transform: rotate(1deg); }
  }
  .nav-links a:hover .nav-icon-phone ~ .nav-label-contact,
  .nav-links a:focus-visible .nav-icon-phone ~ .nav-label-contact {
    display: inline-block;
    animation: nav-text-ring 1.1s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes nav-hammer-swing {
    0%, 60%, 100% { transform: rotate(0deg); }
    8% { transform: rotate(-40deg); }
    22% { transform: rotate(18deg); }
    34% { transform: rotate(-10deg); }
    44% { transform: rotate(6deg); }
    52% { transform: rotate(-2deg); }
  }
  .nav-links a:hover .nav-icon-work svg,
  .nav-links a:focus-visible .nav-icon-work svg {
    animation: nav-hammer-swing 1s ease-in-out infinite;
    transform-origin: 72% 27%;
  }
  @keyframes nav-letter-break {
    0%, 60%, 100% { transform: translate(0,0) rotate(0deg) scale(1); }
    10% { transform: translate(calc(var(--dx) * 0.4), calc(var(--dy) * 0.4)) rotate(calc(var(--dr) * 0.4)) scale(0.8); }
    27% { transform: translate(var(--dx), var(--dy)) rotate(var(--dr)) scale(1.1); }
    40% { transform: translate(calc(var(--dx) * -0.2), calc(var(--dy) * -0.2)) rotate(calc(var(--dr) * -0.15)) scale(0.96); }
  }
  .nav-links a:hover .nav-icon-work ~ .nav-letter,
  .nav-links a:focus-visible .nav-icon-work ~ .nav-letter {
    display: inline-block;
    animation: nav-letter-break 1s cubic-bezier(.36,.07,.19,.97) infinite;
  }
  @keyframes nav-head-tilt {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(-26deg); }
    30% { transform: rotate(10deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(7deg); }
    75% { transform: rotate(-4deg); }
    90% { transform: rotate(2deg); }
  }
  .nav-links a:hover .nav-icon-user .nav-head,
  .nav-links a:focus-visible .nav-icon-user .nav-head {
    animation: nav-head-tilt 1.1s ease-in-out infinite;
  }
  .nav-links .nav-resume {
    color:#fff; border-bottom:1px solid rgba(255,255,255,0.3); padding-bottom:1px;
  }
  .nav-links .nav-resume:hover { border-bottom-color:#fff; }

  /* FLIP CURSOR */
  .render-card { cursor:none; }
  #flip-cursor {
    position:fixed; pointer-events:none; z-index:9999;
    display:none; transform:translate(-50%,-50%);
  }
  #flip-cursor .cursor-btn {
    padding:10px 22px;
    background:rgba(0,0,0,0.85);
    border:1.5px solid #3D7EFF;
    border-radius:4px;
    box-shadow:0 0 12px rgba(61,126,255,0.6),0 0 28px rgba(61,126,255,0.2),inset 0 0 10px rgba(61,126,255,0.08);
    color:#3D7EFF; font-size:11px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase;
    white-space:nowrap; font-family:'Inter',sans-serif;
  }

  /* ── FLIP-STATE 2-DOT INDICATOR ── */
  .render-dots {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 20px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 5;
    pointer-events: none;
  }
  .render-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .render-card:not(.flipped) .render-dot:first-child,
  .render-card.flipped .render-dot:last-child {
    background: #3D7EFF;
    transform: scale(1.3);
  }

  /* RENDER SLIDE */
  .render-card { position:relative; user-select:none; overflow:hidden; }
  .render-track {
    display:flex;
    transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  .render-face, .render-cmf {
    min-width:100%; flex-shrink:0; width:100%;
  }
  .render-face img, .render-cmf img { width:100%; height:auto; display:block; }


  .render-tabs {
    display:flex; background:#f5f5f5; border-bottom:1px solid #e0e0e0;
  }
  .render-tab {
    flex:1; padding:12px 8px; text-align:center;
    font-size:11px; font-weight:700; letter-spacing:0.06em;
    color:#888; cursor:pointer; border-bottom:2px solid transparent;
    transition:all 0.2s; text-transform:uppercase;
  }
  .render-tab:hover { color:#1a5cff; }
  .render-tab.active { color:#1a5cff; border-bottom:2px solid #1a5cff; background:#fff; }

  /* SCROLL TO TOP */
  #btn-top {
    position:fixed; bottom:28px; right:28px; z-index:9998;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(10,10,10,0.82); border:1px solid rgba(255,255,255,0.12);
    border-radius:50%; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity 0.3s,background 0.2s,border-color 0.2s,box-shadow 0.2s,transform 0.2s;
    box-shadow:0 2px 16px rgba(0,0,0,0.28);
  }
  #btn-top.visible { opacity:1; pointer-events:auto; }
  #btn-top:hover {
    background:rgba(26,92,255,0.92); border-color:rgba(26,92,255,0.6);
    box-shadow:0 0 18px rgba(26,92,255,0.45),0 2px 16px rgba(0,0,0,0.3);
    transform:translateY(-3px);
  }
  #btn-top svg { transition:transform 0.2s; }
  #btn-top:hover svg { transform:translateY(-2px); }

  /* OTHER PROJECTS */
  #other-projects { background:#0B0B0B; padding:80px 115.2px 100px; }
  .other-heading {
    font-family:'DM Sans',system-ui,sans-serif; font-size:15px; font-weight:600;
    letter-spacing:0.18em; text-transform:uppercase; color:#3D7EFF; margin-bottom:40px;
  }
  .other-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .other-card {
    text-decoration:none; display:block; position:relative;
    overflow:hidden; border-radius:4px; background:#141312;
  }
  .other-card-img-wrap { overflow:hidden; aspect-ratio:16/10; }
  .other-card img {
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform 0.55s cubic-bezier(0.16,1,0.3,1),filter 0.55s;
    filter:brightness(0.88);
  }
  .other-card:hover img { transform:scale(1.04); filter:brightness(1.0); }
  .other-card-info { padding:16px 18px 18px; }
  .other-card-cat {
    font-family:'DM Sans',system-ui,sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.14em; text-transform:uppercase;
    color:#3D7EFF; margin-bottom:6px; display:block;
  }
  .other-card-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .other-card-title {
    font-family:'DM Sans',system-ui,sans-serif; font-size:15px; font-weight:600;
    color:#EDECEA; letter-spacing:-0.01em; line-height:1.3;
  }
  .other-card-year {
    font-family:'DM Sans',system-ui,sans-serif; font-size:14px; font-weight:500;
    color:#767370; flex-shrink:0;
  }
  .other-card-arrow {
    position:absolute; top:14px; right:16px; font-size:16px; color:#767370;
    opacity:0; transition:opacity 0.2s,transform 0.2s;
  }
  .other-card:hover .other-card-arrow { opacity:1; color:#fff; transform:translate(2px,-2px); }
  .home-cta-wrap { display:flex; justify-content:center; padding:24px 0 32px; background:#0B0B0B; border-top:1px solid rgba(237,236,234,0.12); }
  .home-cta {
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 34px; border:1px solid rgba(255,255,255,0.18); border-radius:40px;
    color:#fff; font-family:'DM Sans',system-ui,sans-serif; font-size:13px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; text-decoration:none;
    transition:background 0.25s, border-color 0.25s, transform 0.25s;
  }
  .home-cta:hover { background:#3D7EFF; border-color:#3D7EFF; transform:translateY(-2px); }

/* MOBILE / PHONE RESPONSIVE LAYOUT (<=768px) — matches index.html's
   breakpoint; the scale-lock JS below is gated the same way. The
   render-card face/CMF flip already supports touch (swipe + tap), so
   only the cosmetic desktop cursor needs disabling. */
@media (max-width: 768px) {
  #scaleOuter { width: 100%; height: auto; }
  #scaleRoot  { position: static; width: 100%; transform: none; }
  #nav { width: 100%; padding: 14px 20px; }
  .nav-links li:nth-child(1), .nav-links li:nth-child(2) { display: none; }
  .nav-links { gap: 18px; }
  .nav-links a { font-size: 0.72rem; }
  .render-card { cursor: pointer; }
  #flip-cursor { display: none !important; }
  #other-projects { padding: 50px 20px 60px; }
  .other-grid { grid-template-columns: 1fr; gap: 16px; }
  .home-cta-wrap { padding: 20px 20px 28px; }
}
</style>

<script>
// RENDER SLIDE
function slideCard(card, toFlipped) {
  if(card.classList.contains('flipped') === toFlipped) return;
  const track = card.querySelector('.render-track');
  track.style.transform = toFlipped ? 'translateX(-100%)' : 'translateX(0%)';
  card.classList.toggle('flipped', toFlipped);
  card.querySelectorAll('.render-tab').forEach((t,i) =>
    t.classList.toggle('active', i === (toFlipped ? 1 : 0))
  );
  if (toFlipped && window.innerWidth <= 768) {
    var hint = card.querySelector('.swipe-hint');
    if (hint) hint.style.display = 'none';
  }
}
function showFace(tab) { slideCard(tab.closest('.render-card'), false); }
function showCMF(tab)  { slideCard(tab.closest('.render-card'), true); if (window.innerWidth <= 768) { tab.style.display = 'none'; } }

document.querySelectorAll('.render-card').forEach(card => {
  card.querySelector('.render-track').addEventListener('click', e => {
    if(e.target.closest('.render-tabs')) return;
    slideCard(card, !card.classList.contains('flipped'));
  });
  let tx=0, ty=0;
  card.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
  card.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = Math.abs(e.changedTouches[0].clientY - ty);
    if(Math.abs(dx)>40 && dy<80) slideCard(card, dx<0);
  });
});

// CUSTOM CURSOR
const flipCursor = document.getElementById('flip-cursor');
document.addEventListener('mousemove', e => {
  flipCursor.style.left = e.clientX+'px';
  flipCursor.style.top  = e.clientY+'px';
});
document.querySelectorAll('.render-card').forEach(card => {
  card.addEventListener('mouseenter', () => flipCursor.style.display='block');
  card.addEventListener('mouseleave', () => flipCursor.style.display='none');
});

// NAV SCROLL
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY>50), {passive:true});

// SCROLL TO TOP
const btnTop = document.getElementById('btn-top');
window.addEventListener('scroll', () => btnTop.classList.toggle('visible', window.scrollY>300), {passive:true});
btnTop.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
</script>

<script>
(function () {
  var DESIGN_WIDTH = 1920;
  var navEl   = document.getElementById('nav');
  var rootEl  = document.getElementById('scaleRoot');
  var outerEl = document.getElementById('scaleOuter');
  if (!navEl || !rootEl || !outerEl) return;

  var applying = false;
  function apply() {
    if (applying) return;
    applying = true;
    if (window.innerWidth <= 768) {
      navEl.style.transform = '';
      rootEl.style.transform = '';
      outerEl.style.height = '';
      applying = false;
      return;
    }
    var scale = window.innerWidth / DESIGN_WIDTH;
    var t = 'scale(' + scale + ')';
    navEl.style.transform  = t;
    rootEl.style.transform = t;
    outerEl.style.height = Math.ceil(rootEl.offsetHeight * scale) + 'px';
    applying = false;
  }

  window.addEventListener('resize', apply, { passive: true });
  window.addEventListener('load', apply);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(apply); }
  setTimeout(apply, 50);
  setTimeout(apply, 400);
  apply();
})();
</script>
